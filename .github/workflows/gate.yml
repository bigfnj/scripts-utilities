name: gate

# WINDOWS POWERSHELL 5.1, NOT pwsh - and that is the whole point of this file.
#
# GitHub's Windows runners default to `shell: pwsh`, and this repository's own documentation
# warns that CI running 7 while production runs 5.1 is how a green build ships a broken script:
# `&&`, `??` and ternary parse cleanly under 7 and are parse ERRORS under 5.1; Get-WmiObject
# and -Encoding Byte exist in one and not the other; Set-Content defaults to ANSI on 5.1 and
# UTF-8 on 7. The weekly SYSTEM forensics task runs powershell.exe.
#
# This is not hypothetical here. smoke-test.ps1 contains a "must parse under 5.1" gate that
# until recently called the parser IN-PROCESS, so running the smoke test from a pwsh prompt
# silently checked 7's grammar - the one check whose entire purpose was catching 7-only syntax
# quietly stopped doing it. A CI job on the wrong host would recreate that with more ceremony.
#
# WHAT IS DELIBERATELY NOT HERE. smoke-test.ps1 itself does not run: it checks ~40 installed
# tools, the machine PATH, and a live Sysmon service, none of which exist on a runner. It would
# fail for environmental reasons, or - worse - be softened until it passed, which is how a gate
# becomes decorative. Only the suites that depend on nothing outside the repository run here.
# The machine-dependent checks stay in run-gate.ps1, where they are true.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suites:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm the host really is 5.1
        shell: powershell
        run: |
          $v = $PSVersionTable.PSVersion
          "host: $v ($($PSVersionTable.PSEdition))"
          if ($v.Major -ne 5) {
            Write-Error "expected Windows PowerShell 5.x, got $v - this job is checking the wrong host"
            exit 1
          }

      # Each suite runs separately so a failure names itself in the job log rather than
      # arriving as one opaque non-zero exit.
      - name: Core suite
        shell: powershell
        run: |
          .\tests\Invoke-CoreTests.ps1
          # $LASTEXITCODE is UNDEFINED at the start of a step, so `-ne 0` is TRUE and
          # `exit $null` yields exit code 0 - the old guard here took its FAILURE branch and
          # exited GREEN. Measured 2026-09-11. It was harmless only by accident, because every
          # suite ends in an explicit `exit`. Bind the value first so the check is real.
          $code = $LASTEXITCODE
          if ($null -eq $code) { Write-Host 'FAIL suite set no exit code'; exit 1 }
          if ($code -ne 0) { exit $code }

      - name: Installer suite
        shell: powershell
        run: |
          .\tests\Invoke-InstallerTests.ps1
          # $LASTEXITCODE is UNDEFINED at the start of a step, so `-ne 0` is TRUE and
          # `exit $null` yields exit code 0 - the old guard here took its FAILURE branch and
          # exited GREEN. Measured 2026-09-11. It was harmless only by accident, because every
          # suite ends in an explicit `exit`. Bind the value first so the check is real.
          $code = $LASTEXITCODE
          if ($null -eq $code) { Write-Host 'FAIL suite set no exit code'; exit 1 }
          if ($code -ne 0) { exit $code }

      - name: Triage suite
        shell: powershell
        run: |
          .\tests\Invoke-TriageTests.ps1
          # $LASTEXITCODE is UNDEFINED at the start of a step, so `-ne 0` is TRUE and
          # `exit $null` yields exit code 0 - the old guard here took its FAILURE branch and
          # exited GREEN. Measured 2026-09-11. It was harmless only by accident, because every
          # suite ends in an explicit `exit`. Bind the value first so the check is real.
          $code = $LASTEXITCODE
          if ($null -eq $code) { Write-Host 'FAIL suite set no exit code'; exit 1 }
          if ($code -ne 0) { exit $code }

      - name: Render suite
        shell: powershell
        run: |
          .\tests\Invoke-RenderTests.ps1
          # $LASTEXITCODE is UNDEFINED at the start of a step, so `-ne 0` is TRUE and
          # `exit $null` yields exit code 0 - the old guard here took its FAILURE branch and
          # exited GREEN. Measured 2026-09-11. It was harmless only by accident, because every
          # suite ends in an explicit `exit`. Bind the value first so the check is real.
          $code = $LASTEXITCODE
          if ($null -eq $code) { Write-Host 'FAIL suite set no exit code'; exit 1 }
          if ($code -ne 0) { exit $code }

      # lib\SmokeLint.ps1 holds the rules that keep scripts\smoke-test.ps1's own checks capable of
      # failing. The script itself is deliberately not run here (see the header); its RULES depend
      # on nothing outside the repository, so they are checked here like everything else.
      - name: SmokeLint suite
        shell: powershell
        run: |
          .\tests\Invoke-SmokeLintTests.ps1
          # $LASTEXITCODE is UNDEFINED at the start of a step, so `-ne 0` is TRUE and
          # `exit $null` yields exit code 0 - the old guard here took its FAILURE branch and
          # exited GREEN. Measured 2026-09-11. It was harmless only by accident, because every
          # suite ends in an explicit `exit`. Bind the value first so the check is real.
          $code = $LASTEXITCODE
          if ($null -eq $code) { Write-Host 'FAIL suite set no exit code'; exit 1 }
          if ($code -ne 0) { exit $code }

      - name: Every script parses under 5.1
        shell: powershell
        run: |
          $bad = 0
          $seen = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $seen++
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e)
            if ($e -and $e.Count) {
              $bad++
              Write-Host ("FAIL {0}: {1}" -f $_.Name, $e[0].Message)
            }
          }
          if ($bad) { exit 1 }
          # A FLOOR. An enumeration that matches nothing printed "all .ps1 parse" and passed -
          # so a renamed directory turned this step green. The local gate already refuses that
          # ("the parse gate swept nothing"); the merge gate did not.
          if ($seen -eq 0) { Write-Host 'FAIL swept 0 .ps1 files - the parse gate examined nothing'; exit 1 }
          "all $seen .ps1 parse under $($PSVersionTable.PSVersion)"

      # The suite list above is hand-maintained, and a suite added to tests\ but not to this
      # file would be silently uncovered on CI while looking covered. Same failure the local
      # gate treats as fatal.
      - name: No test suite is missing from this workflow
        shell: powershell
        run: |
          # THE run: SCALARS, NOT THE WHOLE FILE. Matching the raw YAML also matches COMMENTS,
          # so deleting the "Render suite" step passed as long as the filename survived anywhere
          # in prose - and this file's own next comment forbids exactly that shape. Parse the
          # workflow's run: blocks and look only at what CI actually executes.
          $onDisk = @(Get-ChildItem .\tests -Filter 'Invoke-*Tests.ps1' | ForEach-Object { $_.Name })
          if ($onDisk.Count -eq 0) { Write-Host 'FAIL found 0 suites in tests\ - this check examined nothing'; exit 1 }
          $yaml = (Get-Content .\.github\workflows\gate.yml -Raw) -split "`n"
          $runLines = @()
          $inRun = $false
          foreach ($line in $yaml) {
            if ($line -match '^\s*run:\s*\|') { $inRun = $true; continue }
            if ($inRun) {
              if ($line -match '^\s*-\s' -or $line -match '^\s{0,6}\S' ) { $inRun = $false; continue }
              # STRIP POWERSHELL COMMENTS TOO. A run: block is executable, but a # line inside it
              # is not - and a filename surviving in one is exactly the shape this check exists to
              # reject. Caught by its own control on 2026-09-11: sabotaging the Render step by
              # replacing its invocation with '# was Invoke-RenderTests.ps1 here' was NOT detected
              # until this line was added. A control that passes tells you nothing; this one failed
              # and was right to.
              $runLines += ($line -replace '#.*$', '')
            }
          }
          $wired = ($runLines -join "`n")
          $missing = @($onDisk | Where-Object { $wired -notmatch [regex]::Escape($_) })
          if ($missing.Count) {
            Write-Host ("FAIL test suite(s) not run by CI: {0}" -f ($missing -join ', '))
            exit 1
          }
          "all $($onDisk.Count) suite(s) are wired into CI"

      # ORDER, NOT PRESENCE - and the difference is the whole check.
      #
      # tests\SUTestGuard.ps1 defines a Remove-Item shadow, and a function shadows the cmdlet only
      # for code that runs AFTER the definition. Dot-source it BELOW lib\common.ps1 and
      # common.ps1's own load has already bound the real cmdlet; in Invoke-InstallerTests.ps1 that
      # is the one-line margin SUTestGuard.ps1:19-24 describes, where three Remove-Item calls
      # reach the repository's own manifest\tools.json. The guard would still be in the file, the
      # arm-time control would still print "ARMED", and the exposure would be back.
      #
      # `(Get-Content $f) -match 'SUTestGuard'` passes with the dot-source sitting anywhere,
      # including last - so it asserts the STATEMENT EXISTS rather than the CONDITION holding,
      # which is the lazy shape this repository's standing rule forbids. Taking the FIRST
      # dot-source out of the AST and checking what it loads asserts the order instead.
      #
      # The invocation OPERATOR is what identifies a dot-source, not the command name:
      # `. (Join-Path $PSScriptRoot 'SUTestGuard.ps1')` has no command name at all - its first
      # element is a parenthesised expression - so GetCommandName() returns nothing here.
      - name: The deletion guard is the first dot-source in every suite
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem .\tests -Filter 'Invoke-*Tests.ps1') {
            $ast = [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$null)
            $dots = @($ast.FindAll({ param($n)
              $n -is [System.Management.Automation.Language.CommandAst] -and
              $n.InvocationOperator -eq [System.Management.Automation.Language.TokenKind]::Dot }, $true) |
              Sort-Object { $_.Extent.StartOffset })
            if ($dots.Count -eq 0) {
              Write-Host ("FAIL {0}: no dot-source at all, so tests\SUTestGuard.ps1 is never loaded" -f $f.Name)
              $bad++
              continue
            }
            $first = $dots[0]
            $text = $first.Extent.Text.Trim()
            if ($text -notmatch 'SUTestGuard\.ps1[''"]?\s*\)?\s*$') {
              Write-Host ("FAIL {0}:{1}: the first dot-source loads {2} - tests\SUTestGuard.ps1 must come before it" -f `
                $f.Name, $first.Extent.StartLineNumber, $text)
              $bad++
            } else {
              Write-Host ("ok   {0}:{1} loads the guard first" -f $f.Name, $first.Extent.StartLineNumber)
            }
          }
          if ($bad) { exit 1 }
          "the deletion guard is the first dot-source in every suite"

      # The deletion tripwire shadows Remove-Item, and nothing can shadow Set-Content safely (its
      # positional Path AND positional Value, plus a pipeline-bound -Value, make a naive proxy
      # truncate a multi-item write to its last line). So the writers that reach REAL user state
      # with no path parameter to redirect are prohibited from tests by inspection instead.
      #
      # Write-AgentBlock is deliberately NOT on this list: it takes an explicit -FilePath, so a
      # test can point it at TEMP, and one does. The four below cannot be redirected at all -
      # Write-AgentDiscovery and Remove-AgentBlocks default to four files in the user's profile
      # including the global CLAUDE.md, and the two PATH helpers rewrite the persistent user PATH.
      # A test calling any of them is a negative test aimed at real machine state, which is the
      # exact shape of the 2026-09-10 incident.
      #
      # SUTestGuard.ps1's header claimed this check existed before it did. Written 2026-09-11.
      - name: No test reaches a writer that cannot be redirected
        shell: powershell
        run: |
          $banned = @('Write-AgentDiscovery', 'Remove-AgentBlocks', 'Remove-UserPathEntry', 'Add-UserPathEntry')
          $bad = 0
          foreach ($f in Get-ChildItem .\tests -Filter '*.ps1') {
            $ast = [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$null)
            foreach ($c in $ast.FindAll({ param($n)
                $n -is [System.Management.Automation.Language.CommandAst] }, $true)) {
              $name = $c.GetCommandName()
              if ($name -and ($banned -contains $name)) {
                Write-Host ("FAIL {0}:{1} calls {2} - it writes real user state and takes no path to redirect" -f `
                  $f.Name, $c.Extent.StartLineNumber, $name)
                $bad++
              }
            }
          }
          if ($bad) { exit 1 }
          ("no test calls any of: " + ($banned -join ', '))

      # Stray control characters are the signature of a patch script whose string escapes were
      # interpreted: a Windows path written as "scripts\build" in a tool that processes \b yields
      # a literal BACKSPACE, "P:\tb\native" yields TAB and newline. Two such files reached main on
      # 2026-09-11 - one in a comment, one inside a single-quoted PowerShell string in a test that
      # PASSED, because a single-quoted string may legally span lines and the mangled argument was
      # never read on the path under test.
      #
      # That is why this is a byte check and not a review item: the damage is invisible in every
      # editor and in every `Read`, survives parsing, and survives a green suite. Only `cat -A` or
      # a byte scan shows it. TAB, CR and LF are the only control characters a source file in this
      # repo has any business containing.
      - name: No stray control characters in tracked files
        shell: powershell
        run: |
          # ONE COMPILED REGEX, not a per-byte PowerShell loop. Measured 2026-09-11 over a
          # 48-file / 961 KB tree: the loop was 2,559 ms, this is 39 ms (66x), identical findings.
          # Recorded because the obvious alternative LOSES: [Array]::FindIndex with a
          # [Predicate[byte]] measured 3,642 ms - SLOWER than the loop - because the predicate is
          # a scriptblock invoked once per byte. Same trap class as -Include under -LiteralPath.
          $rx = [regex]::new('[\x00-\x08\x0B\x0C\x0E-\x1F]')
          $bad = 0
          $seen = 0
          $exts = '.ps1', '.psm1', '.json', '.yml', '.md', '.xml', '.cmd'
          foreach ($f in (Get-ChildItem -Recurse -File | Where-Object { $exts -contains $_.Extension })) {
            $seen++
            $text = [IO.File]::ReadAllText($f.FullName)
            $m = $rx.Match($text)
            if ($m.Success) {
              $rel = $f.FullName.Substring((Get-Location).Path.Length + 1)
              $line = ($text.Substring(0, $m.Index) -split "`n").Count
              Write-Host ("FAIL {0}:{1} contains control byte 0x{2:X2} - an interpreted string escape, almost certainly a backslash sequence from a patch script" -f $rel, $line, [int][char]$m.Value[0])
              $bad++
            }
          }
          if ($bad) { exit 1 }
          if ($seen -eq 0) { Write-Host 'FAIL scanned 0 files - this check examined nothing'; exit 1 }
          "no stray control characters in any of $seen tracked source files"
