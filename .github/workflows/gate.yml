name: gate

# WINDOWS POWERSHELL 5.1, NOT pwsh - and that is the whole point of this file.
#
# GitHub's Windows runners default to `shell: pwsh`, and this repository's own documentation
# warns that CI running 7 while production runs 5.1 is how a green build ships a broken script:
# `&&`, `??` and ternary parse cleanly under 7 and are parse ERRORS under 5.1; Get-WmiObject
# and -Encoding Byte exist in one and not the other; Set-Content defaults to ANSI on 5.1 and
# UTF-8 on 7. The weekly SYSTEM forensics task runs powershell.exe.
#
# This is not hypothetical here. smoke-test.ps1 contains a "must parse under 5.1" gate that
# until recently called the parser IN-PROCESS, so running the smoke test from a pwsh prompt
# silently checked 7's grammar - the one check whose entire purpose was catching 7-only syntax
# quietly stopped doing it. A CI job on the wrong host would recreate that with more ceremony.
#
# WHAT IS DELIBERATELY NOT HERE. smoke-test.ps1 itself does not run: it checks ~40 installed
# tools, the machine PATH, and a live Sysmon service, none of which exist on a runner. It would
# fail for environmental reasons, or - worse - be softened until it passed, which is how a gate
# becomes decorative. Only the suites that depend on nothing outside the repository run here.
# The machine-dependent checks stay in run-gate.ps1, where they are true.
#
# TWO JOBS, NOT ONE, AND `if: ${{ !cancelled() }}` ON EVERY STEP. Both are the fix for a measured
# six-day outage rather than tidiness.
#
# On 2026-09-11 a closure-scope bug turned the installer suite red. A failing step aborts the job
# and the installer suite was step 3 of 11, so the parse sweep, the suite-wiring check, the
# deletion-guard order check, the banned-writer scan and the control-character scan all stopped
# running - for six days, while the job reported exactly one problem and every later push looked
# like the same single failure. The local gate could not tell anyone either, because those five
# checks existed ONLY as inline PowerShell in this file.
#
# So: the checks moved into lib\GateChecks.ps1 with run-gate.ps1 as a second caller, they run in
# a SEPARATE job that a red suite cannot abort, and every step carries `!cancelled()` so one
# failure inside a job still reports the rest. `!cancelled()` rather than `always()`, or a
# cancelled run would keep launching steps.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suites:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm the host really is 5.1
        shell: powershell
        run: |
          $v = $PSVersionTable.PSVersion
          "host: $v ($($PSVersionTable.PSEdition))"
          if ($v.Major -ne 5) {
            Write-Error "expected Windows PowerShell 5.x, got $v - this job is checking the wrong host"
            exit 1
          }

      # Each suite runs separately so a failure names itself in the job log rather than
      # arriving as one opaque non-zero exit. Every step is `!cancelled()` so one red suite
      # reports the others instead of hiding them.
      - name: Core suite
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          .\tests\Invoke-CoreTests.ps1
          # $LASTEXITCODE is UNDEFINED at the start of a step, so `-ne 0` is TRUE and
          # `exit $null` yields exit code 0 - the old guard here took its FAILURE branch and
          # exited GREEN. Measured 2026-09-11. It was harmless only by accident, because every
          # suite ends in an explicit `exit`. Bind the value first so the check is real.
          $code = $LASTEXITCODE
          if ($null -eq $code) { Write-Host 'FAIL suite set no exit code'; exit 1 }
          if ($code -ne 0) { exit $code }

      - name: Installer suite
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          .\tests\Invoke-InstallerTests.ps1
          $code = $LASTEXITCODE
          if ($null -eq $code) { Write-Host 'FAIL suite set no exit code'; exit 1 }
          if ($code -ne 0) { exit $code }

      - name: Triage suite
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          .\tests\Invoke-TriageTests.ps1
          $code = $LASTEXITCODE
          if ($null -eq $code) { Write-Host 'FAIL suite set no exit code'; exit 1 }
          if ($code -ne 0) { exit $code }

      - name: Render suite
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          .\tests\Invoke-RenderTests.ps1
          $code = $LASTEXITCODE
          if ($null -eq $code) { Write-Host 'FAIL suite set no exit code'; exit 1 }
          if ($code -ne 0) { exit $code }

      # lib\SmokeLint.ps1 holds the rules that keep scripts\smoke-test.ps1's own checks capable of
      # failing. The script itself is deliberately not run here (see the header); its RULES depend
      # on nothing outside the repository, so they are checked here like everything else.
      - name: SmokeLint suite
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          .\tests\Invoke-SmokeLintTests.ps1
          $code = $LASTEXITCODE
          if ($null -eq $code) { Write-Host 'FAIL suite set no exit code'; exit 1 }
          if ($code -ne 0) { exit $code }

      # The tests FOR the six hygiene checks. They break each check against a synthetic
      # repository under TEMP and assert exactly one finding naming the right file, so the checks
      # in the other job are known to be capable of failing.
      - name: GateChecks suite
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          .\tests\Invoke-GateChecksTests.ps1
          $code = $LASTEXITCODE
          if ($null -eq $code) { Write-Host 'FAIL suite set no exit code'; exit 1 }
          if ($code -ne 0) { exit $code }

  # A SEPARATE JOB, not a step. Six checks lived in this file as inline PowerShell and stopped
  # running the day an unrelated suite went red. A second job cannot be aborted by the first
  # one's failure, so "the suites are broken" and "the repository is malformed" are now two
  # answers instead of one. lib\GateChecks.ps1 holds the definitions and run-gate.ps1 calls the
  # same runner, so neither gate can drift from the other.
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm the host really is 5.1
        shell: powershell
        run: |
          $v = $PSVersionTable.PSVersion
          "host: $v ($($PSVersionTable.PSEdition))"
          if ($v.Major -ne 5) {
            Write-Error "expected Windows PowerShell 5.x, got $v - this job is checking the wrong host"
            exit 1
          }

      # PINNED. markdownlint-cli can add a rule in a minor release and turn this job red on
      # unchanged documentation. 0.48.0 is what catalog.json's npm-global entry put on the
      # maintainer's workstation (measured 2026-09-17), so CI and the local gate judge the same
      # markdown by the same rules. The runner prints the version it used on every run, so a skew
      # is visible in the log rather than mysterious.
      - name: Install markdownlint-cli
        if: ${{ !cancelled() }}
        shell: powershell
        run: npm install -g markdownlint-cli@0.48.0 --no-fund --no-audit

      # ONE STEP FOR ALL SIX CHECKS, and that is not a regression from six steps: the runner
      # reports every check before it exits, so a failure in the parse check no longer hides the
      # markdown check the way a failing STEP hid everything below it.
      - name: Repo checks - parse, gate wiring, guard order, test writers, control bytes, markdown
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          .\scripts\run-gate-checks.ps1
          # $LASTEXITCODE is UNDEFINED at the start of a step, so `-ne 0` is TRUE and
          # `exit $null` yields exit code 0. Bind the value first so the check is real.
          $code = $LASTEXITCODE
          if ($null -eq $code) { Write-Host 'FAIL the checks runner set no exit code'; exit 1 }
          if ($code -ne 0) { exit $code }
